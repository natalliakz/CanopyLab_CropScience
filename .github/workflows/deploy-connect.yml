# Publish everything in this project to Posit Connect when main moves.
#
# This is the "get out of the local mindset" workflow. Nobody clicks Publish;
# main is the source of truth for what is running, and the deployment record is
# the commit history. Connect keeps the previous version, so a bad merge is a
# rollback rather than an incident.
#
# Repository secrets required:
#   CONNECT_SERVER   https://connect.example.com
#   CONNECT_API_KEY  a Connect API key for the publishing account
#
# Until those two secrets exist the deployment steps skip rather than fail, so a
# fresh clone of this repository stays green. Set them in
# Settings -> Secrets and variables -> Actions, and the next push publishes.

name: Deploy to Posit Connect

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: connect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    runs-on: ubuntu-latest
    env:
      CONNECT_SERVER: ${{ secrets.CONNECT_SERVER }}
      CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      # A repository without Connect credentials is a repository that cannot
      # deploy. Say so once, clearly, instead of failing four steps later.
      - name: Check for Connect credentials
        id: creds
        run: |
          if [ -z "$CONNECT_SERVER" ] || [ -z "$CONNECT_API_KEY" ]; then
            echo "::notice::CONNECT_SERVER / CONNECT_API_KEY are not set — skipping deployment."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.creds.outputs.publish == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up R
        if: steps.creds.outputs.publish == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up Quarto
        if: steps.creds.outputs.publish == 'true'
        uses: quarto-dev/quarto-actions/setup@v2

      # renv.lock and Posit Package Manager together are what make the CI
      # runner, the Workbench session and the Connect host agree on versions.
      - name: Restore R packages
        if: steps.creds.outputs.publish == 'true'
        uses: r-lib/actions/setup-renv@v2

      - name: Install the internal package
        if: steps.creds.outputs.publish == 'true'
        run: R CMD INSTALL canopytrials

      # The two CSVs are committed, because git-backed content has no build step.
      # The DuckDB file is not, so CI builds it here for the report, the notebook
      # and the MCP server. A real project would pull from the warehouse instead.
      - name: Generate the trial data
        if: steps.creds.outputs.publish == 'true'
        run: uv run python data/generate_data.py

      - name: Publish the Quarto report
        if: steps.creds.outputs.publish == 'true'
        run: |
          Rscript -e 'rsconnect::addServer(Sys.getenv("CONNECT_SERVER"), "connect")' \
                  -e 'rsconnect::connectApiUser(account = "ci", server = "connect", apiKey = Sys.getenv("CONNECT_API_KEY"))' \
                  -e 'rsconnect::deployDoc("trial-report.qmd", appName = "canopylab-trial-report", server = "connect", forceUpdate = TRUE)'

      # app.R sources canopytrials/R/*.R rather than calling library(canopytrials),
      # so Connect never has to build a package that is not on CRAN -- which means
      # those three files have to be in the bundle.
      - name: Publish the Shiny app
        if: steps.creds.outputs.publish == 'true'
        run: |
          Rscript -e 'rsconnect::deployApp(appDir = ".", appFiles = c("app.R", "_brand.yml", "data/synthetic-field-trials.csv", "data/synthetic-sites.csv", "canopytrials/R/brand.R", "canopytrials/R/data-access.R", "canopytrials/R/summaries.R"), appName = "canopylab-trial-explorer", server = "connect", forceUpdate = TRUE)'

      # Deployed from connect/streamlit/, not from the project root: that
      # directory is the self-contained bundle, and it is also what Connect reads
      # if you deploy this content git-backed instead. Same files either way, so
      # the two paths cannot produce two different apps.
      #
      # If you do point Connect at the repository (New Content -> Import from
      # Git, subdirectory connect/streamlit), delete this step -- Connect
      # re-deploys on its own and two publishers would fight over one content
      # item. See connect/streamlit/README.md.
      - name: Publish the Streamlit app
        if: steps.creds.outputs.publish == 'true'
        run: |
          uv run rsconnect deploy manifest \
            --server "$CONNECT_SERVER" --api-key "$CONNECT_API_KEY" \
            --title "CanopyLab field trial explorer (Python)" \
            connect/streamlit/manifest.json

      - name: Publish the Jupyter notebook
        if: steps.creds.outputs.publish == 'true'
        run: |
          uv run rsconnect deploy notebook \
            --server "$CONNECT_SERVER" --api-key "$CONNECT_API_KEY" \
            --title "CanopyLab field trial tour" \
            notebooks/field-trial-tour.ipynb

      # The MCP server needs the database and the shared trials module inside its
      # own bundle, because Connect unpacks the bundle somewhere of its own
      # choosing and there is no parent project to reach up into.
      - name: Publish the MCP server
        if: steps.creds.outputs.publish == 'true'
        run: |
          cp data/synthetic-agronomy.duckdb mcp/synthetic-agronomy.duckdb
          cp python/trials.py mcp/trials.py
          uv run rsconnect deploy fastapi \
            --server "$CONNECT_SERVER" --api-key "$CONNECT_API_KEY" \
            --entrypoint server:app \
            --title "CanopyLab trials MCP" \
            ./mcp
