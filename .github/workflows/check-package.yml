# Check the internal R package on every pull request.
#
# The point of putting shared logic in canopytrials is that it can be tested
# once instead of reviewed five times. This is where that pays off: a change to
# the definition of "yield response" cannot reach main without the tests passing,
# and the report, the dashboard and the MCP server all inherit that guarantee.

name: Check canopytrials

on:
  pull_request:
    paths:
      - "canopytrials/**"
      - ".github/workflows/check-package.yml"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: canopytrials
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: canopytrials
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
