# Check the shared logic -- both copies of it -- on every pull request.
#
# The point of putting shared logic in canopytrials (R) and python/trials.py
# (Python) is that it can be tested once instead of reviewed five times. This is
# where that pays off: a change to the definition of "yield response" cannot reach
# main without both test suites passing, and the report, the two dashboards and the
# MCP server all inherit that guarantee.

name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  r-package:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: canopytrials
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: canopytrials
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'

  python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # uv.lock, not "latest": the runner installs the same versions a developer
      # has locally, which is the Python half of the reproducibility story that
      # renv.lock and Package Manager tell on the R side.
      - name: Install the locked environment
        run: uv sync --locked

      - name: Test the shared trials module
        run: uv run pytest -q

      # The tests cover trials.py; this catches a syntax error in the app or the
      # MCP server, which no test imports.
      - name: Byte-compile the app and the server
        run: uv run python -m compileall -q streamlit_app.py python mcp

      # connect/streamlit/ is what Connect deploys from Git, and it is built by
      # copying files out of the project root. Nothing stops someone editing
      # python/trials.py and forgetting to rebuild -- except this step, which
      # fails the PR instead of letting the deployed app drift from the repo.
      # Standard library only, so it needs no environment of its own.
      - name: The git-backed Connect bundle matches its sources
        run: python scripts/build_connect_bundle.py --check
