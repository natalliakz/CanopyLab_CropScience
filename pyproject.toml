[project]
name = "canopylab-cropscience"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "altair>=6.2.2",
    "duckdb>=1.5.5",
    "fastmcp>=3.0.0",
    "ggsql>=0.3.3",
    "great-tables>=0.24.0",
    "ipykernel>=7.3.0",
    "jupyter-client>=8.10.0",
    "matplotlib>=3.11.1",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "polars>=1.39.0",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "rsconnect-python>=1.30.0",
    "scikit-learn>=1.8.0",
    "streamlit>=1.62.0",
    "vl-convert-python>=1.9.0.post1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
environments = ["sys_platform != 'win32'"]
